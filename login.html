<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sessão de Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/mediaqueries.css">
</head>

<body>
    <main>
        <section id="container">
            <div id="imagem">
                <!-- imagem é adc na style.css -->
            </div>
            <div id="form">
                <h1>Login</h1>
                <p>Seja bem-vindo(a) novamente à sessão de login. Realize seu acesso para alterar as configurações do seu ambiente.
                </p>
                <form action="login.java" method="post" autocomplete="on">
                    <p>
                        <label for="iusuario">
                            <i id="icoemail" class="material-symbols-outlined">person</i>
                        </label>
                        <input type="email" name="usuario" id="iusuario" placeholder="Digite seu email" required
                            autocomplete="email">
                    </p>
                    <p>
                        <label for="isenha">
                            <i id="icosenha" class="material-symbols-outlined">key</i>
                        </label>
                        <input type="password" name="senha" id="isenha" placeholder="Digite sua senha" required
                            autocomplete="current-password">
                    </p>
                    <button type="submit">Entrar</button>
                    <span class="psw">Esqueceu a <a href="#">senha?</a></span>
                </form>
            </div>
        </section>
    </main>
</body>

</html>
